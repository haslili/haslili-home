      <button style="display:flex;align-items:center;gap:0.5rem;background-color:#f97316;color:white;font-weight:bold;border:none;border-radius:999px;padding:0.5rem 1.2rem;cursor:pointer;">

  </main>

  <!-- 顯示當前時間 -->
  <script>
    const clock = document.getElementById('clock');
    const updateTime = () => {
      const now = new Date();
      const hours = now.getHours().toString().padStart(2, '0');
      const minutes = now.getMinutes().toString().padStart(2, '0');
      clock.textContent = `${hours}:${minutes}`;
    };
    updateTime();
    setInterval(updateTime, 1000);
  </script>
