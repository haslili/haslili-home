<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HasLili</title>

    <!-- 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Agbalumo&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/2e02d93e50.js" crossorigin="anonymous"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        height: 100%;
        width: 100%;
        font-family: monospace;
        overflow: hidden;
        color: white;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      video.background {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
      }
      .language-toggle {
        position: absolute;
        top: 1rem;
        left: 1.5rem;
        font-size: 1.5rem;
        cursor: pointer;
      }
      .defai-title {
        position: absolute;
        top: 1rem;
        right: 1.5rem;
        font-family: 'Imperial Script', cursive;
        font-size: 1.5rem;
        text-shadow: 1px 1px 4px #000;
      }
      .time-display {
        font-size: 2rem;
        color: #ccc;
        margin-bottom: 0.5rem;
        text-shadow: 1px 1px 4px #000;
      }
      .logo {
        font-size: 3rem;
        font-family: 'Imperial Script', cursive;
        margin-bottom: 1rem;
        text-shadow: 2px 2px 6px #000;
      }
      .quote {
        font-family: 'Agbalumo', cursive;
        font-size: 1.4rem;
        text-shadow: 1px 1px 4px #000;
        margin-bottom: 1rem;
      }
      .cta-button {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background-color: #f97316;
        color: white;
        font-weight: bold;
        border: none;
        border-radius: 999px;
        padding: 0.5rem 1.2rem;
        cursor: pointer;
      }
      .social-icons {
        display: flex;
        gap: 1.5rem;
        font-size: 1.5rem;
        margin-top: 2rem;
        margin-bottom: 1rem;
      }
      .music-controls {
        position: fixed;
        bottom: 1rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 1rem;
      }
      .music-controls button {
        background: none;
        border: none;
        font-size: 1.2rem;
        cursor: pointer;
        color: white;
      }
    </style>
  </head>
  <body>
    <!-- 背景動畫 -->
    <video class="background" autoplay loop muted playsinline>
      <source src="000.mp4" type="video/mp4" />
    </video>

    <!-- 左上角語言切換 -->
    <div class="language-toggle" onclick="toggleLang()">
      <i class="fa-solid fa-language fa-xs"></i>
    </div>

    <!-- 右上角 DeFAI -->
    <div class="defai-title">DeFAI</div>

    <!-- 中央內容 -->
    <div class="time-display" id="clock">00:00</div>
    <div class="logo">HasLili</div>
    <div class="quote" id="quote">Here, your silence is enough.</div>

    <button class="cta-button" onclick="alert('登入功能開發中 ✨')">
      Now <i class="fa-solid fa-door-open fa-xs"></i>
    </button>

    <div class="social-icons">
      <a href="https://t.me/+fViab-r0e3w1Zjll" target="_blank"><i class="fa-brands fa-telegram" style="color:#74C0FC;"></i></a>
      <a href="https://discord.gg/WpBXu4UK" target="_blank"><i class="fa-brands fa-discord"></i></a>
      <a href="https://x.com/HasLiang67994" target="_blank"><i class="fa-solid fa-x"></i></a>
      <a href="https://yoko.live/agent/db9bd0e9d0f04118826df3a0c35ea1fd?tab=brain_terminal" target="_blank"><i class="fa-solid fa-robot" style="color:#f56e00;"></i></a>
      <a href="#"><i class="fa-solid fa-book"></i></a>
    </div>

    <div class="music-controls">
      <button onclick="document.getElementById('bg-music').play()"><i class="fa-solid fa-play"></i></button>
      <button onclick="document.getElementById('bg-music').pause()"><i class="fa-solid fa-stop"></i></button>
      <audio id="bg-music" loop src="lofi.mp3"></audio>
    </div>

    <script>
      const clock = document.getElementById('clock');
      const quote = document.getElementById('quote');
      let lang = 'en';
      const messages = {
        en: 'Here, your silence is enough.',
        zh: '在這裡，你的沉默已足夠。',
      };

      function updateTime() {
        const now = new Date();
        const h = now.getHours().toString().padStart(2, '0');
        const m = now.getMinutes().toString().padStart(2, '0');
        clock.textContent = `${h}:${m}`;
      }

      function toggleLang() {
        lang = lang === 'en' ? 'zh' : 'en';
        quote.textContent = messages[lang];
      }

      setInterval(updateTime, 1000);
      updateTime();
    </script>
  </body>
</html>
